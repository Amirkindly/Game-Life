name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Locate project
        run: |
          if [ -f package.json ]; then PROJ=.
          elif [ -f oneineight-apk/package.json ]; then PROJ=oneineight-apk
          else
            Z=$(ls -t *.zip 2>/dev/null | head -1)
            [ -n "$Z" ] || { echo "Project not found"; ls -R | head -60; exit 1; }
            unzip -oq "$Z"
            PROJ=oneineight-apk
          fi
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        working-directory: ${{ env.PROJ }}
        run: |
          npm install
          npx cap add android
          npx cap sync android
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icons/ic_launcher-$d.png $RES/mipmap-$d/ic_launcher.png
            cp icons/ic_launcher_round-$d.png $RES/mipmap-$d/ic_launcher_round.png
          done
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RealLife-apk
          path: ${{ env.PROJ }}/android/app/build/outputs/apk/debug/*.apk
